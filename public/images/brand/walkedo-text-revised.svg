<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -12 2096 224"
     fill="none" role="img" aria-labelledby="walkedo-title">
  <title id="walkedo-title">Walkedo</title>
  <!--
    Grid: unit u = 20 = stroke weight. Cap height 200 (10u), baseline y=200.
    Orthogonal letters (L E D O) sit on a 180 x 200 module (9u x 10u).
    Diagonal letters are built from ONE repeated element: run 120 (6u) per
    full cap height. A = 2 elements, W = 4 elements, K's chevron = 2 half
    elements (run 60). Pointed vertices are inset 7 units so their mitre
    tips align optically with the round terminals (~1% overshoot).
  -->
  <g id="walkedo-wordmark" stroke="currentColor" stroke-width="20"
     stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="8">

    <path id="wm-W" d="M0 0 L120 193 L240 7 L360 193 L480 0"/>

    <path id="wm-A" d="M500 200 L620 7 L740 200"/>

    <path id="wm-L" d="M830 0 L830 200 L1010 200"/>

    <g id="wm-K">
      <path d="M1102 0 L1102 200"/>
      <path d="M1216 0 L1156 100 L1216 200"/>
    </g>

    <g id="wm-E">
      <path d="M1496 0 L1316 0 L1316 200 L1496 200"/>
      <circle cx="1406" cy="100" r="28" fill="currentColor" stroke="none"/>
    </g>

    <path id="wm-D" d="M1596 0 L1776 0 L1776 200 L1596 200"/>

    <path id="wm-O" d="M1896 0 L2076 0 L2076 200 L1896 200 Z"/>

  </g>
</svg>
