<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -12 2134 224"
     fill="none" role="img" aria-labelledby="walkedo-title">
  <title id="walkedo-title">Walkedo</title>
  <!--
    Grid: unit u = 20 = stroke weight. Cap height 200 (10u), baseline y=200.
    Orthogonal letters (L E D O) sit on a 180 x 200 module (9u x 10u).
    W and A are built from one repeated diagonal element: run 120 (6u) per
    full cap height. A = 2 elements, W = 4 elements.
    K keeps its original 45 degree chevron: arms run 100 (5u) over 100 rise.
    Pointed vertices are inset 7 units so their mitre tips align optically
    with the round terminals (~1% overshoot).
  -->
  <g id="walkedo-wordmark" stroke="currentColor" stroke-width="20"
     stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="8">

    <path id="wm-W" d="M0 0 L120 193 L240 7 L360 193 L480 0"/>

    <path id="wm-A" d="M500 200 L620 7 L740 200"/>

    <path id="wm-L" d="M830 0 L830 200 L1010 200"/>

    <g id="wm-K">
      <path d="M1102 0 L1102 200"/>
      <path d="M1260 0 L1160 100 L1260 200"/>
    </g>

    <g id="wm-E">
      <path d="M1534 0 L1354 0 L1354 200 L1534 200"/>
      <circle cx="1444" cy="100" r="28" fill="currentColor" stroke="none"/>
    </g>

    <path id="wm-D" d="M1634 0 L1814 0 L1814 200 L1634 200"/>

    <path id="wm-O" d="M1934 0 L2114 0 L2114 200 L1934 200 Z"/>

  </g>
</svg>
